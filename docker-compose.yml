services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobagent}
      POSTGRES_DB: jobagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobagent:${POSTGRES_PASSWORD:-jobagent}@postgres:5432/jobagent
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://github.com/job-agent}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-job-discovery-agent}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-job_agent_verify_token_secure}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      JOBS_CRON: ${JOBS_CRON:-*/30 * * * *}
      HACKATHONS_CRON: ${HACKATHONS_CRON:-0 * * * *}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
